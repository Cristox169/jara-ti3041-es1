<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrisSteel | Aplicación conectada</title>
  <style>
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #f8fafc; background: #17191d; font-family: "Segoe UI", sans-serif; }
    main { width: min(680px, calc(100% - 32px)); padding: 54px; border: 1px solid #41464f; border-radius: 26px; background: #22262c; box-shadow: 0 28px 80px #0008; }
    span { color: #fbbf24; font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2.7rem, 7vw, 5rem); line-height: .95; letter-spacing: -.06em; }
    p { margin: 0; color: #b8bec8; font-size: 1.1rem; line-height: 1.7; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 28px; padding: 10px 14px; border-radius: 999px; color: #bbf7d0; background: #143425; font-size: .86rem; font-weight: 700; }
    .status::before { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; content: ""; box-shadow: 0 0 0 5px #4ade8025; }
  </style>
</head>
<body>
  <main>
    <span>Etapa 1 · Aplicación Django</span>
    <h1>CrisSteel</h1>
    <p>La aplicación <strong>catalogo</strong> está registrada y sus rutas responden correctamente.</p>
    <div class="status">Sistema conectado</div>
  </main>
</body>
</html>
